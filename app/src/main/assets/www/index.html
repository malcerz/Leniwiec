<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Leniwiec - Rowerowa Nawigacja Płaska</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <!-- Map Container -->
    <div id="map"></div>

    <!-- Floating button to restore UI when hidden -->
    <button id="show-ui-btn" class="glass-panel hidden" style="position: absolute; top: 16px; left: 16px; z-index: 100; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-primary); cursor: pointer; pointer-events: auto; border: 1px solid var(--panel-border); background: var(--panel-bg); box-shadow: var(--shadow-premium);">
        <i data-lucide="eye" style="width: 20px; height: 20px;"></i>
    </button>

    <!-- UI Overlay -->
    <div class="app-container">
        <!-- Top Search Panel -->
        <header class="glass-panel search-panel">
            <div class="logo">
                <i data-lucide="navigation" class="logo-icon"></i>
                <span class="logo-text">Leniwiec</span>
                <button id="data-manage-btn" class="icon-btn" title="Zarządzaj danymi routingu" style="margin-left: auto;">
                    <i data-lucide="hard-drive" style="width:16px; height:16px;"></i>
                </button>
            </div>

            <div class="mode-tabs">
                <button id="mode-ab-btn" class="tab-btn active"><i data-lucide="navigation-2" style="width:12px; height:12px; display:inline-block; margin-right:4px;"></i>Trasa A-B</button>
                <button id="mode-loop-btn" class="tab-btn"><i data-lucide="rotate-ccw" style="width:12px; height:12px; display:inline-block; margin-right:4px;"></i>Pętla</button>
            </div>
            
            <div class="input-group">
                <div class="input-row">
                    <i data-lucide="circle-dot" class="input-icon start-icon"></i>
                    <input type="text" id="start-input" placeholder="Wpisz punkt startowy A..." autocomplete="off">
                    <button id="use-gps-btn" class="icon-btn" title="Użyj mojej lokalizacji">
                        <i data-lucide="locate"></i>
                    </button>
                    <div id="start-suggestions" class="suggestions-list hidden"></div>
                </div>
                <div class="input-divider mode-ab-only"></div>
                <div class="input-row mode-ab-only" id="end-row">
                    <i data-lucide="map-pin" class="input-icon end-icon"></i>
                    <input type="text" id="end-input" placeholder="Wpisz cel podróży B..." autocomplete="off">
                    <div id="end-suggestions" class="suggestions-list hidden"></div>
                </div>
                <div class="input-row mode-loop-only hidden" id="loop-row">
                    <i data-lucide="milestone" class="input-icon loop-icon" style="color: var(--accent-emerald-light);"></i>
                    <span style="font-size: 14px; font-weight: 500; margin-right: 12px; color: var(--text-secondary);">Dystans pętli:</span>
                    <input type="number" id="loop-distance-input" value="10" min="5" max="100" style="max-width: 70px; text-align: center; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 4px; color: white; outline: none;">
                    <span style="font-size: 14px; font-weight: 500; margin-left: 8px; color: var(--text-secondary);">km</span>
                </div>
            </div>

            <div class="route-count-row">
                <span class="route-count-label">Liczba tras:</span>
                <div class="route-count-controls">
                    <button id="route-count-minus" class="count-btn">−</button>
                    <input type="number" id="route-count-input" value="3" min="1" max="66" readonly>
                    <button id="route-count-plus" class="count-btn">+</button>
                </div>
                <span id="route-count-desc" class="route-count-desc">alternatyw</span>
            </div>

            <div class="action-row">
                <button id="plan-btn" class="primary-btn">
                    <i data-lucide="route"></i> Zaplanuj trasę
                </button>
            </div>
        </header>

        <!-- Route Details & Elevation Panel (hidden initially) -->
        <div id="results-panel" class="glass-panel results-panel hidden">
            <div id="results-header" style="cursor: pointer; user-select: none;">
                <div class="panel-handle"></div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <h3 class="panel-title" style="margin: 0;">Dostępne trasy</h3>
                    <i id="collapse-icon" data-lucide="chevron-down" style="width: 18px; height: 18px; color: var(--text-secondary); transition: transform 0.3s;"></i>
                </div>
            </div>
            
            <div id="results-scroll-container" style="display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1;">
                <div id="routes-container" class="routes-list">
                    <!-- Route Cards will be dynamically inserted here -->
                </div>
    
                <!-- Elevation Graph Section -->
                <div class="elevation-section">
                    <div class="elevation-header">
                        <h4>Profil wysokościowy</h4>
                        <span id="elevation-summary">Wybierz trasę, by zobaczyć profil</span>
                    </div>
                    <div class="chart-container">
                        <canvas id="elevation-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div id="loader" class="loader-overlay hidden">
        <div class="loader-spinner"></div>
        <p class="loader-text">Obliczanie płaskich tras...</p>
    </div>

    <!-- Data Management Modal -->
    <div id="data-modal" class="modal-overlay hidden">
        <div class="modal-panel glass-panel">
            <div class="modal-header">
                <h3><i data-lucide="hard-drive" style="width:18px; height:18px; display:inline-block; margin-right:8px;"></i>Dane routingu offline</h3>
                <button id="data-modal-close" class="icon-btn"><i data-lucide="x" style="width:18px; height:18px;"></i></button>
            </div>
            <div class="modal-body">
                <p class="modal-info">Pobierz dane nawigacyjne dla wybranego regionu, aby liczyć trasy offline bez limitów.</p>
                <div id="regions-list" class="regions-list">
                    <!-- Region items inserted dynamically -->
                </div>
                <div class="download-progress-container hidden" id="download-progress-container">
                    <div class="progress-bar-bg">
                        <div id="download-progress-bar" class="progress-bar-fill" style="width: 0%;"></div>
                    </div>
                    <span id="download-progress-text" class="progress-text">0%</span>
                </div>
                <div class="data-stats">
                    <span id="data-status-text">Sprawdzanie pobranych danych...</span>
                </div>
            </div>
            <div class="modal-footer">
                <button id="delete-all-data-btn" class="danger-btn hidden"><i data-lucide="trash-2" style="width:14px; height:14px; display:inline-block; margin-right:4px;"></i>Usuń wszystkie dane</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="geo-utils.js"></script>
    <script src="app.js"></script>
</body>
</html>
